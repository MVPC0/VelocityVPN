<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VelocityVPN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      min-height: 480px;
      background: #050507;
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .header {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: 'Archivo', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.04em;
    }
    .logo span { color: #E85D4E; }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 6px rgba(239,68,68,0.5);
    }
    .status-dot.active {
      background: #4ADE80;
      box-shadow: 0 0 6px rgba(74,222,128,0.5);
    }

    .main {
      padding: 16px;
    }

    /* Protection Banner */
    .protection-banner {
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .protection-banner.protected {
      background: rgba(74,222,128,0.08);
      border: 1px solid rgba(74,222,128,0.2);
    }
    .protection-banner.exposed {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
    }
    .protection-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .protected .protection-icon { background: rgba(74,222,128,0.15); }
    .exposed .protection-icon { background: rgba(239,68,68,0.15); }
    .protection-text { flex: 1; }
    .protection-text .label {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .protected .label { color: #4ADE80; }
    .exposed .label { color: #EF4444; }
    .protection-text .sublabel {
      font-size: 11px;
      color: #9CA3AF;
      margin-top: 2px;
    }

    /* IP Display */
    .ip-card {
      background: #111118;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .ip-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6B7280;
    }
    .ip-value {
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
      font-size: 20px;
      color: #fff;
      margin-top: 4px;
      letter-spacing: 0.04em;
    }
    .ip-location {
      font-size: 11px;
      color: #9CA3AF;
      margin-top: 4px;
    }

    /* Server Selector */
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6B7280;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .server-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    .server-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .server-item:hover {
      background: rgba(255,255,255,0.04);
    }
    .server-item.selected {
      background: rgba(232,93,78,0.08);
      border-color: rgba(232,93,78,0.3);
    }
    .server-item.connected {
      background: rgba(74,222,128,0.08);
      border-color: rgba(74,222,128,0.3);
    }
    .server-flag { font-size: 18px; }
    .server-info { flex: 1; }
    .server-name {
      font-size: 12px;
      font-weight: 600;
    }
    .server-city {
      font-size: 10px;
      color: #6B7280;
    }
    .server-ping {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #4ADE80;
    }

    /* Connect Button */
    .connect-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.02em;
    }
    .connect-btn.connect {
      background: #E85D4E;
      color: #fff;
    }
    .connect-btn.connect:hover { background: #D44A3C; }
    .connect-btn.disconnect {
      background: rgba(239,68,68,0.15);
      color: #EF4444;
      border: 1px solid rgba(239,68,68,0.3);
    }
    .connect-btn.disconnect:hover {
      background: rgba(239,68,68,0.25);
    }
    .connect-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Footer */
    .footer {
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      text-align: center;
    }
    .footer-text {
      font-size: 10px;
      color: #4ADE80;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .footer-sublabel {
      font-size: 9px;
      color: #6B7280;
      margin-top: 4px;
    }

    /* Spinner */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    /* Scrollbar */
    .server-list::-webkit-scrollbar { width: 3px; }
    .server-list::-webkit-scrollbar-track { background: transparent; }
    .server-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">VELOCIT<span>Y</span></div>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <div class="main">
    <!-- Protection Status -->
    <div class="protection-banner exposed" id="protectionBanner">
      <div class="protection-icon" id="protectionIcon">&#x1F534;</div>
      <div class="protection-text">
        <div class="label" id="protectionLabel">
          EXPOSED
          <span style="font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(239,68,68,0.3);color:#EF4444;">NO VPN</span>
        </div>
        <div class="sublabel" id="protectionSublabel">Your real IP is visible</div>
      </div>
    </div>

    <!-- IP Display -->
    <div class="ip-card">
      <div class="ip-label" id="ipLabel">PUBLIC IP</div>
      <div class="ip-value" id="ipValue">--.--.--.--</div>
      <div class="ip-location" id="ipLocation">Detecting...</div>
    </div>

    <!-- Server List -->
    <div class="section-title">
      <span>Select Server</span>
      <span id="serverCount">18 locations</span>
    </div>
    <div class="server-list" id="serverList"></div>

    <!-- Connect Button -->
    <button class="connect-btn connect" id="connectBtn" disabled>
      Loading...
    </button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-text">
      <span style="font-size:12px;">&#x1F512;</span>
      <span>Zero Logs Policy</span>
    </div>
    <div class="footer-sublabel">We don't store connection or traffic data</div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
